name: GainTrack
options:
  bundleIdPrefix: com.gaintrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: ar
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  GainTrack:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Shortcuts
    dependencies:
      - package: ZIPFoundation
      - target: GainTrackWidgetExtension
        embed: true
    # No entitlements by default (App Groups / CloudKit) — see README for enabling
    # them on a properly provisioned (paid Apple Developer account) build. Requesting
    # entitlements an ad-hoc/sideloaded signing identity can't satisfy causes the OS
    # to kill the app at launch with no error, which is worse than the widget/iCloud
    # sync simply not being available.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GainTrack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "GainTrack يحتاج الكاميرا لتوثيق المهام اليومية بالصور."
        NSPhotoLibraryAddUsageDescription: "لتصدير صورك للمكتبة عند طلبك فقط."
        NSUserNotificationsUsageDescription: "لتذكيرك بمواعيد الدواء والمكملات والمية."
        UIBackgroundModes:
          - fetch
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaintrack.app
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GainTrackWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Core/Models
      - path: Core/Utilities
      - path: Core/Extensions
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaintrack.app.widget
        SKIP_INSTALL: "YES"

  GainTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GainTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaintrack.app.tests

schemes:
  GainTrack:
    build:
      targets:
        GainTrack: all
    test:
      targets:
        - GainTrackTests
    run:
      config: Debug
